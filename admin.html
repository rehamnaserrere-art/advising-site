<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأدمن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen active">
        <div class="login-box">
            <h2>لوحة تحكم الأدمن</h2>
            <p>هنا يمكنك تحديث بيانات الطلاب من جوجل درايف بضغطة زر.</p>
            <hr>
            <button onclick="syncData()" style="background-color: #28a745;">تحديث بيانات الطلاب (Sync)</button>
            <p id="status" style="margin-top: 20px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        // رابط دالة تحديث البيانات
        const SYNC_FUNCTION_URL = 'https://xylmdahldlkwvkjjjfdj.supabase.co/functions/v1/sync-students';

        async function syncData() {
            const status = document.getElementById('status');
            status.innerText = "جاري الاتصال بجوجل درايف واستيراد البيانات...";
            status.style.color = "blue";

            try {
                const response = await fetch(SYNC_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();

                if (response.ok) {
                    status.innerText = result.message;
                    status.style.color = "green";
                } else {
                    status.innerText = "خطأ: " + result.error;
                    status.style.color = "red";
                }
            } catch (error) {
                status.innerText = "حدث خطأ في الاتصال بالسيرفر.";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
