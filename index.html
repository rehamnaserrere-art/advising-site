<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات الإرشاد الأكاديمي - علوم الرياضة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2>أهلاً بك في الإرشاد الأكاديمي</h2>
            <p>كلية علوم الرياضة - جامعة الإسكندرية</p>
            <hr>
            <p>يرجى إدخال الرقم القومي (أرقام فقط)</p>
            <input type="text" id="national-id" placeholder="الرقم القومي" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button onclick="login()">دخول</button>
            <p id="error-msg" style="color: red; display: none;"></p>
        </div>
    </div>

    <!-- شاشة الخدمات (تظهر بعد تسجيل الدخول) -->
    <div id="services-screen" class="screen">
        <div class="header">
            <h1>خدمات الإرشاد الأكاديمي</h1>
            <h3>الطالب: <span id="student-name"></span></h3>
            <h3>المرشد الأكاديمي: <span id="advisor-name"></span></h3>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="services-grid">
            <a id="btn-form1" href="#" target="_blank" class="service-card">
                <h3>📄 استمارة الحذف والإضافة</h3>
                <p>اضغط لفتح الاستمارة</p>
            </a>
            <a id="btn-form2" href="#" target="_blank" class="service-card">
                <h3>📄 استمارة الانسحاب من مقرر</h3>
                <p>اضغط لفتح الاستمارة</p>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
